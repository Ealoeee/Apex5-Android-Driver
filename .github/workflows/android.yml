name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore Persistent Signing Keystore
        env:
          APEX5_KEYSTORE_B64: ${{ secrets.APEX5_KEYSTORE_B64 }}
          APEX5_STORE_PASSWORD: ${{ secrets.APEX5_STORE_PASSWORD }}
          APEX5_KEY_ALIAS: ${{ secrets.APEX5_KEY_ALIAS }}
          APEX5_KEY_PASSWORD: ${{ secrets.APEX5_KEY_PASSWORD }}
        run: |
          if [ -n "$APEX5_KEYSTORE_B64" ]; then
            echo "$APEX5_KEYSTORE_B64" | base64 -d > app/apex5-signing.jks
            printf "storeFile=apex5-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$APEX5_STORE_PASSWORD" "$APEX5_KEY_ALIAS" "$APEX5_KEY_PASSWORD" > signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare versioned APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Apex5-Driver-${{ github.ref_name }}-debug.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex5-driver-debug-apk
          path: dist/*.apk

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
